    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const SETTINGS_STORAGE_KEY = "admin-platform-settings-cache";
        const DEFAULT_PLATFORM_NAME = "Multicourses";
        const DEFAULT_THEME_COLOR = "#2563eb";
        const DEFAULT_BACKGROUND_COLOR = "#ffffff";
        const DEFAULT_SHORT_NAME = "Multicourses";
        const DEFAULT_COURSES_LABEL = "Courses";
        const DEFAULT_GRADES_LABEL = "Grades";
        const DEFAULT_DESCRIPTION =
          "Academic operations platform for teachers, students, admins, and institutions.";
        const DEFAULT_TOUCH_ICON = "/apple-touch-icon.png";
        const DEFAULT_SHARE_IMAGE = "/icon-512.png";

        const normalizeString = (value, fallback = "") => {
          const normalized = String(value || "").trim();
          return normalized || fallback;
        };

        const normalizeHexColor = (value, fallback) =>
          /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(value || "").trim())
            ? String(value).trim()
            : fallback;

        const inferImageType = (value) => {
          const normalized = String(value || "").trim().toLowerCase();
          if (normalized.endsWith(".svg")) return "image/svg+xml";
          if (normalized.endsWith(".webp")) return "image/webp";
          if (normalized.endsWith(".jpg") || normalized.endsWith(".jpeg")) return "image/jpeg";
          if (normalized.endsWith(".ico")) return "image/x-icon";
          return "image/png";
        };

        let storedSettings = null;
        try {
          const raw = window.localStorage.getItem(SETTINGS_STORAGE_KEY);
          storedSettings = raw ? JSON.parse(raw) : null;
        } catch {
          storedSettings = null;
        }

        const platformName = normalizeString(
          storedSettings && typeof storedSettings === "object" ? storedSettings.platformName : "",
          DEFAULT_PLATFORM_NAME,
        );
        const shortName =
          platformName.length > 18 ? `${platformName.slice(0, 17).trim()}…` : platformName;
        const touchIcon = normalizeString(
          storedSettings && typeof storedSettings === "object"
            ? storedSettings.touchIconUrl || storedSettings.logoUrl
            : "",
          DEFAULT_TOUCH_ICON,
        );
        const shareImage = normalizeString(
          storedSettings && typeof storedSettings === "object"
            ? storedSettings.shareImageUrl || storedSettings.logoUrl
            : "",
          DEFAULT_SHARE_IMAGE,
        );
        const description = normalizeString(
          storedSettings && typeof storedSettings === "object" ? storedSettings.siteDescription : "",
          DEFAULT_DESCRIPTION,
        );
        const themeColor = normalizeHexColor(
          storedSettings && typeof storedSettings === "object" ? storedSettings.themeColor : "",
          DEFAULT_THEME_COLOR,
        );
        const backgroundColor = normalizeHexColor(
          storedSettings && typeof storedSettings === "object"
            ? storedSettings.pwaBackgroundColor
            : "",
          DEFAULT_BACKGROUND_COLOR,
        );
        const manifestShortName = normalizeString(
          storedSettings && typeof storedSettings === "object"
            ? storedSettings.pwaShortName
            : "",
          shortName || DEFAULT_SHORT_NAME,
        );
        const coursesShortcutLabel = normalizeString(
          storedSettings && typeof storedSettings === "object"
            ? storedSettings.pwaCoursesShortcutLabel
            : "",
          DEFAULT_COURSES_LABEL,
        );
        const gradesShortcutLabel = normalizeString(
          storedSettings && typeof storedSettings === "object"
            ? storedSettings.pwaGradesShortcutLabel
            : "",
          DEFAULT_GRADES_LABEL,
        );

        const manifest = {
          id: "/",
          name: platformName,
          short_name: manifestShortName,
          description,
          start_url: "/",
          scope: "/",
          display: "standalone",
          background_color: backgroundColor,
          theme_color: themeColor,
          orientation: "portrait",
          icons: [
            {
              src: touchIcon,
              sizes: "192x192",
              type: inferImageType(touchIcon),
              purpose: "any",
            },
            {
              src: shareImage,
              sizes: "512x512",
              type: inferImageType(shareImage),
              purpose: "any",
            },
          ],
          shortcuts: [
            {
              name: coursesShortcutLabel,
              short_name: coursesShortcutLabel,
              url: "/courses",
              icons: [{ src: touchIcon, sizes: "192x192", type: inferImageType(touchIcon) }],
            },
            {
              name: gradesShortcutLabel,
              short_name: gradesShortcutLabel,
              url: "/grades",
              icons: [{ src: touchIcon, sizes: "192x192", type: inferImageType(touchIcon) }],
            },
          ],
        };

        const manifestLink = document.createElement("link");
        manifestLink.rel = "manifest";
        manifestLink.href =
          `data:application/manifest+json;charset=utf-8,${encodeURIComponent(JSON.stringify(manifest))}`;
        document.head.appendChild(manifestLink);
      })();
    </script>
